<svg
  viewBox="0 0 32 32"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Rounded square background -->
  <rect
    x="2"
    y="2"
    width="28"
    height="28"
    rx="6"
    fill="none"
    stroke="#0066cc"
    strokeWidth="1.5"
  />
  
  <!-- Terminal prompt glyph: > -->
  <path
    d="M 10 18 L 16 12 L 10 6"
    stroke="#0066cc"
    strokeWidth="2"
    fill="none"
    strokeLinecap="round"
    strokeLinejoin="round"
  />
  
  <!-- Underscore (_) as cursor -->
  <line
    x1="18"
    y1="20"
    x2="24"
    y2="20"
    stroke="#0066cc"
    strokeWidth="2"
    strokeLinecap="round"
  />
</svg>
