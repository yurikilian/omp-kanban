name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Validate agent and skill definitions
        run: ./validate.py

      - name: Check installer syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Check manifest is valid JSON
        run: python3 -c "import json; json.load(open('package.json'))"

      - name: Installer smoke test
        run: |
          ./install.sh --project --dry-run
          ./install.sh --project
          test -f .omp/agents/kb-critic.md
          test -f .omp/skills/kanban-cycle/SKILL.md
          test -f .omp/skills/cost-forensics/SKILL.md
          test -f .omp/skills/rendered-geometry-tests/SKILL.md
          test "$(ls .omp/agents/*.md | wc -l)" -eq 10
          test "$(ls -d .omp/skills/*/ | wc -l)" -eq 3
          # Board hooks install without --with-dashboard; the dashboard hook does not.
          test -f .omp/hooks/pre/kb-geometry-guard.ts
          test -f .omp/hooks/post/kb-qa-coverage.ts
          test ! -f .omp/hooks/pre/kb-dashboard.ts
          ./uninstall.sh --project
          test ! -d .omp/skills/kanban-cycle
          test ! -d .omp/skills/cost-forensics
          test ! -d .omp/skills/rendered-geometry-tests
          test ! -f .omp/hooks/pre/kb-geometry-guard.ts
          test ! -f .omp/hooks/post/kb-qa-coverage.ts
          test ! -f .omp/agents/kb-critic.md
